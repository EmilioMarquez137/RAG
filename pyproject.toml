[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-transcript-pipeline"
version = "0.1.0"
description = "Transcript preparation and exploratory analysis for a RAG QA system"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.3",
    "sentencepiece==0.2.1",
    "tiktoken==0.14.0",
    "torch==2.8.0",
    "transformers==4.57.3",
]

[project.optional-dependencies]
sentence-transformers = [
    "sentence-transformers==5.1.2",
]

[tool.setuptools]
py-modules = []


